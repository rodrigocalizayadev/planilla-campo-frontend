<div class="control-orden">
  @if (opciones().length > 1) {
    <select
      class="control-orden__select"
      aria-label="Ordenar por"
      [value]="campoActivo()"
      (change)="onCampoChange($event)"
    >
      @for (opcion of opciones(); track opcion.valor) {
        <option [value]="opcion.valor">{{ opcion.etiqueta }}</option>
      }
    </select>
  }
  <button
    type="button"
    class="control-orden__boton"
    [class.control-orden__boton--unido]="opciones().length > 1"
    [attr.aria-label]="'Orden ' + (direccion() === 'asc' ? 'ascendente' : 'descendente') + ' por ' + etiquetaActiva()"
    (click)="alternarDireccion()"
  >
    @if (opciones().length === 1) {
      {{ etiquetaActiva() }}
    }
    <span class="control-orden__flecha">{{ direccion() === 'asc' ? '↑' : '↓' }}</span>
  </button>
</div>
